# Dyness Aquavolt register map
# Source: Modbus_Protocol_Hybrid_S-V1_15.pdf (DYNESS Modbus Protocol – Hybrid Inverter, V1.15)
# All addresses are decimal. Real value = raw value / Mult.
#
# Register groups:
#   117-133   AC Port / AC power (voltage, current, frequency, power)
#   170-176   Battery 1 + inverter state
#   181-200   Energy counters
#   213-214   SOC + operate mode
#   262-278   Utility P1 measure point (second AC side)
#   2000-2026 BMS information
#   25243-25278 Operation mode & system settings (RW)
#   25350-25363 Battery parameters (RW)
#   27500-27548 EMS manage data (RW)

MISSING:
    sensor:
        - sn_code
        - software_version
    binary:
        - discharge_limit_mode
    select:
        - grid_standard
    number:
        - charging_cutoff_capacity
        - discharging_cutoff_capacity

